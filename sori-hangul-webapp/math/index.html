<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>숫자 기차 수학 모험</title><style>
*{box-sizing:border-box}body{margin:0;background:#17264a;color:#253b5d;font-family:system-ui,sans-serif;text-align:center}main{max-width:780px;margin:auto;padding:14px}header{display:flex;justify-content:space-between;gap:6px;color:white;font-weight:800;align-items:center}.chip{background:#324c79;border-radius:24px;padding:8px;font-size:14px}.world{height:220px;position:relative;border-radius:24px;overflow:hidden;margin:14px 0;background:linear-gradient(#92ddff 0 67%,#a1dc8c 67%)}.sun{position:absolute;right:8%;top:12%;font-size:46px}.trees{position:absolute;bottom:38px;font-size:70px;width:140%;animation:trees 4s linear infinite}.track{position:absolute;bottom:24px;width:100%;height:15px;border-block:4px solid #79513b;background:repeating-linear-gradient(90deg,transparent 0 28px,#79513b 28px 35px)}.train{position:absolute;bottom:37px;left:12%;font-size:66px;animation:bob .45s infinite alternate}.monster{position:absolute;bottom:45px;right:13%;font-size:64px}.world.attack .train{animation:lunge .65s ease}.world.attack .monster{animation:hit .65s ease}.world.hurt{animation:shake .4s}.world.hurt .monster{animation:lunge .4s reverse}@keyframes trees{to{transform:translateX(-24%)}}@keyframes bob{to{transform:translateY(-5px)}}@keyframes lunge{50%{transform:translateX(65px)}}@keyframes hit{50%{transform:translateX(18px) rotate(20deg)}}@keyframes shake{25%,75%{transform:translateX(5px)}50%{transform:translateX(-5px)}}.card{background:#fff9ec;border:3px solid #f4d38f;border-radius:24px;padding:18px;min-height:235px}.tag{color:#788ba3;font-weight:800}.question{font-size:clamp(22px,6vw,32px);font-weight:900;margin:14px 0}.picture{font-size:30px;line-height:1.4;overflow-wrap:anywhere}.choices{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{border:0;border-radius:15px;padding:13px 24px;background:#ffdf7e;box-shadow:0 5px #d7ac4f;color:#44371d;font-size:23px;font-weight:900;cursor:pointer}button:disabled{opacity:.55;cursor:default}.go{font-size:17px;background:#a0e4c2;box-shadow:0 5px #6aaf90}.quiet{font-size:14px;background:#d5e8ff;box-shadow:0 4px #a4c3e3;padding:10px}.feedback{min-height:28px;font-weight:800;color:#bc6148}.bottom{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}footer{font-size:12px;color:#bed2e8;margin:18px}button:focus-visible{outline:3px solid #2569dd}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main><header><span>🚂 숫자 기차 모험</span><span class="chip" id="level">Lv. 1</span><span class="chip" id="stars">⭐ 0</span><span class="chip" id="hp">❤️❤️❤️</span></header><div class="world" id="world"><div class="sun">☀️</div><div class="trees">🌲　🌳　🌲　🌳　🌲　🌳　🌲</div><div class="track"></div><div class="train">🚂</div><div class="monster" id="monster">👾</div></div><section class="card"><div class="tag" id="tag">숫자 숲으로 출발해요!</div><div class="question" id="question">수학 마법으로 길을 열어요</div><div class="picture" id="picture">🍎 🍎 🍎</div><div class="choices" id="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p><button class="go" id="start">🚂 모험 시작</button><div class="bottom"><button class="quiet" id="reset">처음부터 하기</button></div></section><footer>진행 기록은 이 기기의 브라우저에 저장됩니다.</footer></main><script>
const key='math-train-adventure-v1', $=id=>document.getElementById(id);let game={level:1,stars:0,hp:3,step:0},problem=null,locked=false,timer=null;
function save(){try{localStorage.setItem(key,JSON.stringify(game))}catch(e){$('feedback').textContent='기록을 저장할 수 없어요. 브라우저 저장 공간을 확인해 주세요.'}}
try{let saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&Number.isInteger(saved.level)&&saved.level>0&&Number.isInteger(saved.stars)&&saved.stars>=0&&Number.isInteger(saved.hp)&&saved.hp>=1&&saved.hp<=3&&Number.isInteger(saved.step)&&saved.step>=0&&saved.step<5){game=saved;$('start').textContent='🚂 이어서 모험하기'}}catch(e){}
function display(){$('level').textContent='Lv. '+game.level;$('stars').textContent='⭐ '+game.stars;$('hp').textContent='❤️'.repeat(game.hp)+'🤍'.repeat(3-game.hp)}display();
function rand(n){return Math.floor(Math.random()*n)}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function makeProblem(){let difficulty=Math.min(game.level,4),kind=rand(3),a,b,answer,q,picture='';if(kind===0){answer=1+rand(Math.min(5+difficulty,9));q='과일은 모두 몇 개일까요?';picture='🍎 '.repeat(answer)}else if(kind===1){a=1+rand(2+difficulty);b=1+rand(2+difficulty);answer=a+b;q=a+' + '+b+' = ?';picture='🍎 '.repeat(a)+' + '+'🍎 '.repeat(b)}else{a=2+rand(3+difficulty);b=1+rand(a);answer=a-b;q=a+' − '+b+' = ?';picture='🍊 '.repeat(a)+' 중 '+b+'개를 가져갔어요'}let options=new Set([answer]);let limit=Math.max(12,answer+5);while(options.size<3)options.add(rand(limit));return{q,picture,answer,options:shuffle([...options])}}
function show(){locked=false;problem=makeProblem();$('world').classList.remove('attack','hurt');$('tag').textContent='미션 '+(game.step+1)+' / 5 · '+['수 세기','덧셈','뺄셈'][problem.q.includes('+')?1:problem.q.includes('−')?2:0];$('question').textContent=problem.q;$('picture').textContent=problem.picture;$('feedback').textContent='';$('start').hidden=true;$('choices').replaceChildren();for(const n of problem.options){const b=document.createElement('button');b.textContent=n;b.onclick=()=>choose(n);$('choices').appendChild(b)}display()}
function choose(n){if(locked||!problem)return;locked=true;$('choices').querySelectorAll('button').forEach(b=>b.disabled=true);if(n===problem.answer){game.stars++;game.step++;$('world').classList.add('attack');$('monster').textContent='💥';$('feedback').textContent='정답! 숫자 마법 발사! ⭐';if(game.step===5){game.level++;game.step=0;game.hp=3;$('feedback').textContent='정답! 레벨 업! 에너지가 회복됐어요 🎉'}save();display();timer=setTimeout(()=>{$('monster').textContent=['👾','👻','🐲','🦊'][rand(4)];show()},1300)}else{game.hp--;$('world').classList.add('hurt');$('feedback').textContent='몬스터의 반격! 괜찮아요, 다시 해봐요.';if(game.hp===0){game.hp=3;game.level=Math.max(1,game.level-1);game.step=0;$('feedback').textContent='에너지 회복! 이전 레벨에서 다시 출발해요.'}save();display();timer=setTimeout(show,1300)}}
$('start').onclick=show;$('reset').onclick=()=>{if(!confirm('저장된 수학 모험 기록을 지우고 처음부터 시작할까요?'))return;clearTimeout(timer);game={level:1,stars:0,hp:3,step:0};problem=null;save();display();$('choices').replaceChildren();$('question').textContent='수학 마법으로 길을 열어요';$('picture').textContent='🍎 🍎 🍎';$('tag').textContent='숫자 숲으로 출발해요!';$('feedback').textContent='';$('start').hidden=false;$('start').textContent='🚂 모험 시작'};
</script></body></html>
