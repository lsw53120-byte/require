<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#167ddc"><title>소리한글 어드벤처</title><style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;800&display=swap');:root{--navy:#24304c;--blue:#1788e8;--yellow:#ffd84f;--orange:#ff7b43;--pink:#ff5d94;--green:#36c997}*{box-sizing:border-box}body{margin:0;background:#d9eaf7;color:var(--navy);font-family:'Noto Sans KR',sans-serif}.game{width:min(100%,520px);min-height:100vh;margin:auto;background:#eaf8ff;overflow:hidden;box-shadow:0 0 45px #204b6a33}.top{height:64px;background:#167bd6;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.avatar{display:flex;align-items:center;gap:8px;font-family:Jua;font-size:18px}.avatar-face{display:grid;place-items:center;background:#ffe5a5;width:36px;height:36px;border:3px solid #fff;border-radius:50%;font-size:23px}.stats{display:flex;gap:8px}.stat{display:flex;align-items:center;gap:3px;background:#116abd;border:1px solid #5db7ed;border-radius:99px;padding:6px 9px;font:13px Jua}.stage{position:relative;min-height:375px;padding:22px 20px 28px;background:linear-gradient(#2ac5eb 0 36%,#7fe4f0 36% 42%,#f9d66c 42% 70%,#70d28f 70%);overflow:hidden}.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 75% 20%,#fff7a766 0 35px,transparent 36px),linear-gradient(166deg,transparent 48%,#ffffff32 49% 50%,transparent 51%);pointer-events:none}.cloud{position:absolute;background:#e8fbff;border-radius:99px;width:85px;height:22px;top:75px;left:-10px;box-shadow:35px -9px 0 -4px #e8fbff}.cloud.two{top:120px;left:auto;right:-28px;transform:scale(.7)}.stage-content{position:relative;z-index:1}.quest-label{display:inline-block;background:#ff658d;color:#fff;border:3px solid #fff;border-radius:12px;padding:7px 12px;font:14px Jua;box-shadow:0 4px 0 #c84170;transform:rotate(-2deg)}.quest h1{font:31px/1.12 Jua;color:#fff;text-shadow:0 3px 0 #1263aa;margin:16px 0 4px}.quest p{color:#fff;font-size:12px;margin:0}.character{position:absolute;right:24px;bottom:35px;font-size:92px;filter:drop-shadow(0 8px 0 #2b91a055);animation:float 2.5s ease-in-out infinite}.character:after{content:"";position:absolute;bottom:-11px;left:10px;width:78px;height:16px;background:#54b77c99;border-radius:50%;z-index:-1}@keyframes float{50%{transform:translateY(-8px) rotate(3deg)}}.sign{position:absolute;right:15px;bottom:27px;background:#e99c43;color:#fff;border:4px solid #fff;border-radius:10px;padding:8px 11px;font:17px Jua;transform:rotate(5deg);box-shadow:0 4px 0 #c6722d}.mission{margin:-3px 14px 0;background:#fff;border:4px solid #2d72a8;border-radius:20px;box-shadow:0 7px 0 #24638f;padding:13px 14px;position:relative;z-index:3}.mission-top{display:flex;justify-content:space-between;align-items:center}.mission b{font:20px Jua}.mission small{color:#8b9aac;font-size:10px}.meter{height:11px;background:#e9edf2;border-radius:99px;margin-top:10px;overflow:hidden}.meter i{display:block;height:100%;width:38%;background:linear-gradient(90deg,#ffb038,#ff6e5e);border-radius:99px;transition:.4s}.mission-go{border:0;background:#ff7c45;color:#fff;border-radius:12px;padding:10px 14px;font:15px Jua;box-shadow:0 4px 0 #cf5430;cursor:pointer}.section{padding:22px 18px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:11px}.section-head h2{font:23px Jua;margin:2px 0}.section-head span{font-size:11px;color:#8a9cac}.path{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.level{border:0;border-radius:17px;background:#fff;padding:10px 5px 11px;box-shadow:0 4px 0 #c9dde8;cursor:pointer;position:relative;color:var(--navy)}.level.done{background:#fff6cc}.level.current{background:#e1f8ff;outline:3px solid #23aee6}.level.locked{opacity:.6}.level-icon{width:47px;height:47px;border-radius:15px;margin:auto;display:grid;place-items:center;font:27px Jua;color:#fff}.l1{background:#ff8061}.l2{background:#f1bf42}.l3{background:#55c99c}.level b{display:block;font-size:11px;margin-top:7px}.level small{color:#95a0ab;font-size:9px}.check{position:absolute;right:5px;top:5px;color:#2cbe85}.play-zone{padding:18px;background:#edfaff;min-height:400px}.play-card{background:#fff;border:4px solid #267ebd;border-radius:23px;box-shadow:0 7px 0 #a9cde1;padding:19px 15px;text-align:center}.play-card .eyebrow{color:#e8753d;font-size:11px;font-weight:800;letter-spacing:1px}.play-card h2{font:27px Jua;margin:8px 0}.sound-letter{font:87px Jua;color:#1c85dc;line-height:1;margin:5px}.listen{border:0;border-radius:99px;padding:11px 17px;background:#e7f6ff;color:#107bd0;font-weight:800;cursor:pointer}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:21px}.choice{border:0;border-radius:13px;background:#eaf0ff;color:#2e4c72;padding:15px 5px;font:26px Jua;box-shadow:0 4px 0 #c5d0e8;cursor:pointer}.choice:hover,.choice.good{background:#fff0aa;color:#e35d28;box-shadow:0 4px 0 #e2b83b}.choice.bad{animation:shake .25s}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}.feedback{min-height:26px;margin-top:14px;color:#ed6b3d;font-size:12px;font-weight:800}.reward{text-align:center;padding:15px}.reward .stars{font-size:42px;letter-spacing:5px;animation:pop .5s}@keyframes pop{50%{transform:scale(1.25)}}.again{border:0;background:#1788e8;color:#fff;border-radius:12px;padding:11px 20px;font:16px Jua;cursor:pointer}footer{text-align:center;color:#90a3ae;font-size:10px;padding:4px 0 22px}@media(min-width:700px){body{padding:30px 0}.game{border-radius:30px}}[hidden]{display:none!important}

 canvas,button{touch-action:manipulation}
 footer{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
}
</style></head><body><main class="game"><header class="top"><div class="avatar"><span class="avatar-face">🦊</span><span>지우의 모험</span></div><div class="stats"><span class="stat">❤️ 3</span><span class="stat">⭐ 128</span><span class="stat">Lv. 2</span></div></header><section class="stage"><div class="cloud"></div><div class="cloud two"></div><div class="stage-content"><span class="quest-label">오늘의 모험 01</span><div class="quest"><h1>소리섬에 도착했어요!</h1><p>첫소리 보물을 찾아 미션을 완료해요.</p></div></div><div class="character">🦊</div><div class="sign">소리섬</div></section><section class="mission"><div class="mission-top"><div><small>오늘의 미션</small><b> 글자 보물 3개 찾기</b></div><button class="mission-go" id="start">시작!</button></div><div class="meter"><i id="meter"></i></div></section><section class="section"><div class="section-head"><div><span>ADVENTURE MAP</span><h2>한글 모험 지도</h2></div><span>1 / 3 스테이지</span></div><div class="path"><button class="level done" id="level1"><span class="level-icon l1">가</span><b>소리 동굴</b><small>완료 ✓</small><span class="check">●</span></button><button class="level current"><span class="level-icon l2">나</span><b>단어 숲</b><small>지금 도전!</small></button><button class="level locked"><span class="level-icon l3">다</span><b>문장 마을</b><small>🔒 잠김</small></button></div></section><section class="play-zone" id="playZone"><div class="play-card"><span class="eyebrow">소리 보물찾기 · 1단계</span><h2>“가”의 첫소리를 골라요!</h2><div class="sound-letter">가</div><button class="listen" id="listen">🔊 소리 듣기</button><div class="choices"><button class="choice" data-a="ㄱ">ㄱ</button><button class="choice" data-a="ㄴ">ㄴ</button><button class="choice" data-a="ㅁ">ㅁ</button></div><div class="feedback" id="feedback">정답을 고르면 보물상자가 열려요!</div></div></section><footer>소리로 배우고, 모험으로 기억해요 ✨</footer></main><script src="adventure.js?v=20261125-writing-audio"></script></body></html>
